{% extends "layout.html" %}

{% block title %}
    Leaderboard
{% endblock %}

{% block main %}
    <h1>Leaderboard</h1>
    <br>
    <table class="table">
        <thead>
            <tr>
                <th class="text-start">Username</th>
                <th class="text-end">Rank</th>
                <th class="text-end">KM</th>
                <th class="text-end">CO2</th>
                <th class="text-end">XP</th>
            </tr>
        </thead>
        <tbody>
        {% for user in users %}
            <tr>
                <td class="text-start">{{ user.username }}</td>
                <td class="text-end">{{ user.rank }}</td>
                <td class="text-end">{{ "%.2f"|format(user.km) }}</td>
                <td class="text-end">{{ "%.2f"|format(user.co2) }}</td>
                <td class="text-end">{{ user.xp }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
{% endblock %}
